spring.application.name=com.poc.graphql
server.port=9091

spring.datasource.url=jdbc:mysql://localhost:3306/poc-graphql?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.graphql.graphiql.enabled=true

# SAML 2.0 SSO (this app is the service provider, registration id "sso")
# The IdP is Microsoft Entra ID, enterprise application "graphql-poc". Override with AZURE_TENANT_ID / AZURE_APP_ID.
app.saml.azure.tenant-id=${AZURE_TENANT_ID:6c476749-e3a2-4f2f-a779-f06ea293bc6a}
app.saml.azure.app-id=${AZURE_APP_ID:543b8645-c694-4244-9bee-43ae7350d457}
# Set SAML_IDP_METADATA_URI instead to use another IdP, e.g. https://mocksaml.com/api/saml/metadata for local testing.
spring.security.saml2.relyingparty.registration.sso.assertingparty.metadata-uri=${SAML_IDP_METADATA_URI:https://login.microsoftonline.com/${app.saml.azure.tenant-id}/federationmetadata/2007-06/federationmetadata.xml?appid=${app.saml.azure.app-id}}
# No SP signing key is configured, so login requests are sent unsigned
spring.security.saml2.relyingparty.registration.sso.assertingparty.singlesignon.sign-request=false

# Assertion attributes used to create the local user on first sign-in (Entra ID default claim names)
app.saml.attribute.email=http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
app.saml.attribute.first-name=http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname
app.saml.attribute.last-name=http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
